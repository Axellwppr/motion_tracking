# low latency
policy_path: "ckpts/G1_PMG/policy.onnx"
use_compliance_flag_obs: false
compliance_flag_value: 1.0 # 0.0 to disable compliance, 1.0 to enable compliance
compliance_flag_threshold: 10.0 # 10.0 ~ 20.0
future_steps: [0, 1, 2, 3, 4, 5, 6, -1, -2, -4, -8, -12, -16] # format: [0, ...future, ...history]
motion_source:
  type: "udp"
  udp:
    enable: true
    host: "127.0.0.1"
    port: 28562
  vr:
    req_addr: "tcp://127.0.0.1:28701"
    rep_addr: "tcp://127.0.0.1:28702"
    ctrl_addr: "tcp://127.0.0.1:28703"
    low_watermark: 7 # when to request frame
    high_watermark: 7 # when to stop requesting frame; should be >= low_watermark
    inflight_lifetime_steps: 0 # how many steps to wait before considering an inflight request as failed
root_linacc_history_steps: [0, 1, 2, 3, 4, 8, 12, 16, 20]
root_angvel_history_steps: [0, 1, 2, 3, 4, 8, 12, 16, 20]
projected_gravity_history_steps: [0, 1, 2, 3, 4, 8, 12, 16, 20]
joint_pos_history_steps: [0, 1, 2, 3, 4, 8, 12, 16, 20]
joint_vel_history_steps: [0, 1, 2, 3, 4, 8, 12, 16, 20]
prev_action_steps: 8
switch_tail_keep_steps: 8 # keep old ref tail on motion switch; final keep is max(this, abs(min(future_steps)))
boot_indicator_max: 25

motions:
  - name: "walk1_subject1"
    path: "motions/walk1_subject1.npz"
    start: 0
    end: -1
  - name: "walk2_subject1"
    path: "motions/walk2_subject1.npz"
    start: 0
    end: -1
  - name: "walk3_subject1"
    path: "motions/walk3_subject1.npz"
    start: 0
    end: -1
